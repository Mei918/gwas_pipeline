[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwas-pipeline"
version = "0.3.0"
description = "Installable Python package for end-to-end GWAS tutorial workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "May" }
]
dependencies = [
  "matplotlib>=3.8",
  "networkx>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "twine>=5.1",
]

[project.scripts]
gwas-pipeline = "gwas_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gwas_pipeline*"]
